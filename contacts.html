<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 { margin: 0; font-size: 2rem; }

        main {
            flex: 1;
            max-width: 600px;
            width: 100%;
            margin: 40px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        .contact-box {
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .info-block {
            margin-bottom: 25px;
        }

        .info-block p {
            margin: 5px 0;
            font-size: 1.1rem;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #3730a3;
        }
    </style>
</head>
<body>

    <header>
        <h1>Наши контакты</h1>
    </header>

    <main>
        <div class="contact-box">
            <div class="info-block">
                <p><strong>ИНН:</strong> 7708423119</p>
                <p><strong>Email:</strong> chastoria@mail.ru</p>
                <p><strong>Телефон:</strong> +7 (926) 892-43-31</p>
                <p><strong>Телефон:</strong> +7 (901) 714-74-25</p>
                <p><strong>Адрес:</strong> г. Москва, муниципальный округ Красносельский, пер 3-й Новый, дом 5 стр 1.</p>
            </div>
            
            
            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

            <!-- Кнопка возврата на главную -->
            <a href="index.html" class="back-btn">&larr; Назад на главную</a>
        </div>
    </main>
    <footer>
        <p style="text-align: center; padding: 20px; color: #666; font-size: 0.9rem;">
            &copy; 2026 by NT.Studio.  Все права защищены.
        </p>
    </footer>
</body>
</html>
